- question_id: Q-02
  category: Organisation and policy
  question: Are you ISO 27001 certified, or do you have a SOC 2 report?
  short_answer: 'no'
  approved_answer: No. We have no certificate or audit report. Our controls follow ISO/IEC 27002:2022; see the statement
    of applicability.
  answer_status: explained_no
  answer_owner: CEO
  last_reviewed: '2026-09-20'
  next_review: '2027-03-03'
