- question_id: Q-11
  category: Development and vulnerabilities
  question: How do you manage vulnerabilities in the software you use?
  short_answer: partly
  approved_answer: Partly. Every build is scanned automatically; we fix critical vulnerabilities within 7 days and
    high ones within 30 days. We have only recorded whether those deadlines are met since August 2026.
  answer_status: partial
  answer_owner: Lead developer
