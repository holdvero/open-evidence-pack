- question_id: Q-08
  category: Data and privacy
  question: Is data encrypted at rest and in transit?
  short_answer: 'yes'
  approved_answer: Yes. Transport via TLS 1.2 or higher. Database and backups are encrypted at rest with keys managed
    by the hosting provider.
  answer_status: evidenced
  answer_owner: CTO
  last_reviewed: '2026-09-20'
  next_review: '2027-02-14'
