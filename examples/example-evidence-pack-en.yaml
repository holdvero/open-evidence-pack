- question_id: Q-07
  category: Data and privacy
  question: Where is our data stored?
  short_answer: described
  approved_answer: In our hosting provider's data centres in the Netherlands and Germany. Backups are in the same
    regions.
  answer_status: evidenced
  answer_owner: Operations
  last_reviewed: '2026-09-20'
  next_review: '2027-05-01'
  evidence:
