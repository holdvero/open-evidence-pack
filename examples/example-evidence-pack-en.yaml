- question_id: Q-10
  category: Development and vulnerabilities
  question: Do you have a penetration test performed every year?
  short_answer: 'yes'
  approved_answer: Yes. Latest test by an external party in May 2026. Two medium findings are resolved; one low
    finding is open with a plan. Summary available under NDA.
  answer_status: evidenced
  answer_owner: CTO
