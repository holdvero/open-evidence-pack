- question_id: Q-04
  category: Access
  question: Do you use MFA for all access to production systems?
  short_answer: 'yes'
  approved_answer: Yes, for all employees and administrators, enforced in the identity provider. For customers'
    end users, MFA can be enabled per customer environment but is not mandatory by default.
  answer_status: evidenced
  answer_owner: CTO
  last_reviewed: '2026-09-20'
  next_review: '2027-03-10'
